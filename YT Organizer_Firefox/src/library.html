<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YT Organizer Library</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon16.png" alt="YT Organizer" class="logo" />
      <div class="title">YT Organizer Library</div>
      <div class="header-actions">
        <button id="export-btn" class="ghost-btn" title="Export categories as JSON">Export</button>
        <label class="ghost-btn import-label" title="Import categories from JSON">
          Import
          <input type="file" id="import-file" accept=".json,application/json" />
        </label>
        <button id="refresh-btn">Refresh</button>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>Categories</span>
          <button id="new-category-btn" class="icon-btn" title="New category">+</button>
        </div>
        <div id="new-category-row" class="new-category-row hidden">
          <input id="new-category-name" placeholder="Category name" />
          <button id="add-category-btn">Add</button>
          <button id="cancel-category-btn" class="ghost-btn">Cancel</button>
        </div>
        <div id="category-list" class="category-list"></div>
        <div id="import-status" class="status"></div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <div id="active-category-name" class="active-category-name">Select a category</div>
          <div class="toolbar-controls">
            <div class="segmented" id="group-toggle">
              <button data-group="all" class="active">All videos</button>
              <button data-group="creator">By creator</button>
            </div>
          </div>
        </div>
        <div id="videos" class="videos"></div>
        <div id="empty" class="empty">No categories yet. Click "+" to create one.</div>
        <section id="suggestions" class="suggestions hidden">
          <div class="suggestions-header">Featured by creators in this category</div>
          <div id="suggestions-list" class="suggestions-list"></div>
        </section>
      </main>
    </div>

    <script src="library.js"></script>
  </body>
</html>
